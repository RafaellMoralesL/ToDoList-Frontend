worker_processes  1;
events { worker_connections  1024; }
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /goals/ {
            proxy_pass http://host.docker.internal:3000/goals/;
            proxy_set_header Host $host;
        }
        location /tasks/ {
            proxy_pass http://host.docker.internal:3000/tasks/;
            proxy_set_header Host $host;
        }
    }
}